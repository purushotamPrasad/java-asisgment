server:
  port: 8082

eureka:
  client:
    serviceUrl:
      defaultZone: http://46.28.44.11:8761/eureka/

kafka:
  producer:
    bootstrap-servers: 46.28.44.11:9092
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    auth-topic: auth-events
    group-topic: group-events
    role-topic: role-events
    user-topic: user-events

authService:
  tokenEndpoint: https://auth.qssence.com/realms/authrealm/protocol/openid-connect/token

keycloak:
  realm: authrealm

subscription:
  panel:
    decode-url: http://46.28.44.11:8085/api/v2/licenses/decode/



