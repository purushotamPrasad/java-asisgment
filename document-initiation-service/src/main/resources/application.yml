management:
  endpoints:
    web:
      exposure:
        include: "*"
   endpoint:
        health:
        show-details: always

  document-initiation-service:
    image: qssencebackend_new_document-initiation-service
    ports:
      - "8084:8084"
    depends_on:
      - mongo
  spring:
   data:
     mongodb:
       uri: mongodb://docuser:docpass@mongo-db:27017/documentdb


