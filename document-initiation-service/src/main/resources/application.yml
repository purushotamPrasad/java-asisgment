spring:
  application:
    name: document-initiation-service

  cloud:
    discovery:
      client:
        simple:
          instances:
            auth-service:
              - uri: http://46.28.44.11:8082 # adjust if different

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.qssence.com/realms/authrealm
          # Or, if needed:
          # jwk-set-uri: https://auth.qssence.com/realms/authrealm/protocol/openid-connect/certs

  datasource:
    url: jdbc:postgresql://46.28.44.11:5432/document-initiation
    username: keycloak
    password: root@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://46.28.44.11:8761/eureka/

        #***REMOVED***
        #***REMOVED*** "REDACTED"
        # secret-key: "REDACTED"
  region: us-east-1
  s3:
    bucket: qssence-bucket

server:
  port: 8084


